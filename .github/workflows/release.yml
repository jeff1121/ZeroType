name: Build and Release Desktop Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: 打包 Windows Release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath release\ZeroType-Windows-x64.zip
          (Get-FileHash release\ZeroType-Windows-x64.zip -Algorithm SHA256).Hash.ToLower() + "  ZeroType-Windows-x64.zip" | Out-File -Encoding ascii release\SHA256SUMS-Windows.txt

      - name: 上傳 Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZeroType-Windows-x64
          path: release/*

      - name: 上傳 Windows 檔案至 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ZeroType ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: release/*

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: 建置 macOS Release
        run: flutter build macos --release

      - name: 匯入程式碼簽署憑證
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/zerotype_signing.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/zerotype-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          rm -f "$CERTIFICATE_PATH"

      - name: 簽署 macOS App（自簽憑證 ZeroType）
        run: |
          codesign --force --deep --sign "ZeroType" "build/macos/Build/Products/Release/Zero Type.app"

      - name: 驗證建置後 App 簽章封印
        run: |
          chmod +x scripts/verify_macos_release.sh
          scripts/verify_macos_release.sh "build/macos/Build/Products/Release/Zero Type.app"

      - name: 打包 macOS Release
        run: |
          mkdir -p release
          hdiutil create -volname "ZeroType" -srcfolder "build/macos/Build/Products/Release/Zero Type.app" -ov -format UDZO "release/ZeroType-macOS.dmg"
          ditto -c -k --sequesterRsrc --keepParent "build/macos/Build/Products/Release/Zero Type.app" "release/ZeroType-macOS-arm64.zip"
          shasum -a 256 release/ZeroType-macOS.dmg release/ZeroType-macOS-arm64.zip > release/SHA256SUMS.txt

      - name: 驗證 DMG 內 App 簽章封印
        run: scripts/verify_macos_release.sh "release/ZeroType-macOS.dmg"

      - name: 上傳 macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZeroType-macOS
          path: release/*

      - name: 上傳 macOS 檔案至 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ZeroType ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: release/*
